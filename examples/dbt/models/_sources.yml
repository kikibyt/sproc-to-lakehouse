    columns:
    - name: event_id
      data_tests:
      - not_null
      - unique
  - name: claims
    columns:
    - name: claim_id
      data_tests:
      - not_null
      - unique
  - name: dispenses
    columns:
    - name: dispense_id
      data_tests:
      - not_null
      - unique
  - name: etl_run_log
    columns:
    - name: run_id
      data_tests:
      - not_null
      - unique
  - name: inventory_movements
    columns:
    - name: movement_id
      data_tests:
      - not_null
      - unique
  - name: patient_contact_clean
    columns:
    - name: patient_id
      data_tests:
      - not_null
      - unique
  - name: payers
    columns:
    - name: payer_id
      data_tests:
      - not_null
      - unique
  - name: prescriber_monthly_rollup
    columns:
    - name: period_month
      data_tests: &id001
      - not_null
