      data_tests: *id001
  - name: products
    columns:
    - name: product_id
      data_tests:
      - not_null
      - unique
  - name: shipments
    columns:
    - name: shipment_id
      data_tests:
      - not_null
      - unique
  - name: sites
    columns:
    - name: site_id
      data_tests:
      - not_null
      - unique
  - name: stg_patient_enrollments
    columns:
    - name: stg_row_id
      data_tests:
      - not_null
      - unique
