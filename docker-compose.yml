# SQL Server for parity testing (Phase 4). Developer edition: free for development
# and testing, not for production use. Start with:  docker compose up -d
# The password is read from SPROC2LH_MSSQL_PASSWORD (must meet SQL Server's
# complexity rules: 8+ characters with upper case, lower case, digits and symbols).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sproc2lh-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SPROC2LH_MSSQL_PASSWORD:?set SPROC2LH_MSSQL_PASSWORD first}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
