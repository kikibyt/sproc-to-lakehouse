[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sproc-to-lakehouse"
version = "0.1.0"
description = "Migrate T-SQL stored procedures to Databricks (dbt / PySpark) with explicit conversion reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly: conversion results in reports depend on sqlglot's behaviour.
    "sqlglot==30.25.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "Jinja2>=3.1",
]
# Optional: check generated SQL against a local Apache Spark (needs Java 17+).
spark = [
    "pyspark>=4.0",
]
# Optional: parity testing against SQL Server (Docker) and Spark + Delta Lake.
parity = [
    "pyspark>=4.0",
    "delta-spark>=4.0",
    "pymssql>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: needs pyspark and a Java runtime (skipped when unavailable)",
    "parity: needs SQL Server + Spark/Delta (skipped unless SPROC2LH_MSSQL_PASSWORD is set)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
