# Answer key for the sample corpus.
#
# For each procedure: the overall verdict, the exact set of rule IDs the analyzer must
# report, and the exact subset reported at needs_review severity. Written by reading
# each procedure, not by snapshotting tool output; tests/test_corpus.py enforces it.
#
# Verdicts: auto | auto_with_note | needs_review (worst severity across findings).

